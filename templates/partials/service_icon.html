{% if src %}<img class="svc-icon" src="{{ src }}" alt="" width="{{ size }}" height="{{ size }}" style="width: {{ size }}px; height: {{ size }}px; max-width: none;">{% elif remote %}<span class="svc-icon svc-letter svc-remote" style="--hue: {{ hue }}; width: {{ size }}px; height: {{ size }}px; position: relative; overflow: hidden;" aria-hidden="true">{{ letter }}<img src="{{ remote }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" style="position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: contain; background: #fff; border-radius: 0; box-shadow: none;"></span>{% else %}<span class="svc-icon svc-letter" style="--hue: {{ hue }}; width: {{ size }}px; height: {{ size }}px;" aria-hidden="true">{{ letter }}</span>{% endif %}
